<!doctype html>
<html lang="fr">
<head>
<title>EU ETS 2 : estimez l'impact de la taxe carbone sur votre flotte | Flexy Green</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Estimez en deux minutes le surcoût de la taxe carbone EU ETS 2 sur vos carburants à partir du 1er janvier 2028, au kilomètre, au litre et sur 3 ans.">
<meta property="og:title" content="EU ETS 2 : combien la taxe carbone coûtera-t-elle à votre flotte ?">
<meta property="og:description" content="Un calculateur gratuit proposé par Flexy Green, Groupe Berto.">
<meta property="og:image" content="assets/logo-flexy-green.png">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap">
<link rel="icon" href="assets/logo-flexy-green.png">
<style>
/* Charte : page claire et sobre, une seule police (Space Grotesk, charte Groupe Berto).
   La couleur est réservée au sens : rouge Berto = coût carbone, vert Flexy Green = solutions, bleu Katalii = optimisation. */
:root{color-scheme:light;
  --bg:#FFFFFF;--surface:#FFFFFF;--surface-2:#F5F7F6;--ink:#1B201D;--muted:#69726D;--line:#E7EBE8;
  --emerald:#009641;--emerald-ink:#00813A;--emerald-soft:#EAF6EF;
  --warn:#A15C07;--warn-soft:#FBF4E6;--crit:#E2001F;--crit-soft:#FDF1F2;--red-muted:#F2B6BE;
  --lime:#4D7C0F;--lime-soft:#F2F7E9;--katalii:#023C4C;--katalii-soft:#EEF3F4;
}
html,body{background:var(--bg);color:var(--ink)}
/* Mode intégré (iframe dans une page WordPress) : fond transparent, pour épouser celui de la page hôte */
html.embed,html.embed body{background:transparent}
body{font-family:"Space Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px;line-height:1.55;margin:0}
.font-display{letter-spacing:-.02em}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{text-wrap:balance}
.eyebrow{font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:500;color:var(--muted)}
input[type=range]{accent-color:var(--emerald);width:100%}
input[type=checkbox]{accent-color:var(--emerald);width:16px;height:16px}
:focus-visible{outline:2px solid var(--emerald);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<script>
// Mode intégré : ?embed=1 dans l'adresse, ou page affichée dans un cadre
window.EMBED = (function () { try { return new URLSearchParams(location.search).get('embed') === '1' || window.self !== window.top; } catch (e) { return true; } })();
if (window.EMBED) document.documentElement.classList.add('embed');
</script>
<script src="https://cdn.tailwindcss.com/3.4.16"></script>
<script>
tailwind.config={theme:{extend:{colors:{
  bg:'var(--bg)',surface:'var(--surface)',surface2:'var(--surface-2)',ink:'var(--ink)',muted:'var(--muted)',line:'var(--line)',
  emerald:'var(--emerald)',emink:'var(--emerald-ink)',emsoft:'var(--emerald-soft)',
  katalii:'var(--katalii)',katsoft:'var(--katalii-soft)',warn:'var(--warn)',warnsoft:'var(--warn-soft)',crit:'var(--crit)',critsoft:'var(--crit-soft)'}}}};
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.25.6/babel.min.js"></script>
</head>
<body>
<div id="root"><p style="padding:32px 16px;color:#69726D">Chargement du calculateur… Une connexion internet est nécessaire.</p></div>

<script type="text/babel" data-presets="react">
const { useState, useMemo, useEffect } = React;

/* ============================================================
   1. MOTEUR DE CALCUL (fonctions pures, testables dans la console)
   ============================================================ */
// Facteur d'émission du gazole retenu pour l'EU ETS 2 (règlement (UE) 2018/2066), en tCO2 par litre
const FE_DIESEL = 0.00268;
const PRICES = [
  { price: 45,  label: 'Prix bas' },
  { price: 60,  label: 'Prix central' },
  { price: 100, label: 'Prix haut' },
];
const YEARS = 3;               // durée de projection : contrats Berto de 36 mois minimum
const ECO_MIN = 0.15, ECO_MAX = 0.20; // gain de carburant attribué à l'éco-conduite

const surcoutLitre = price => FE_DIESEL * price;                       // €/L HT
const surcoutKm = (conso100, price) => conso100 / 100 * FE_DIESEL * price; // €/km
const volumeAn = (km, conso100) => km * conso100 / 100;                 // L/an
const surcoutAn = (km, conso100, price, share = 0) => volumeAn(km, conso100) * FE_DIESEL * price * (1 - share);

// Verdict économique selon la part de l'exposition neutralisée (0 à 1)
const VERDICTS = [
  { min: 1,    tone: 'em',   title: 'Taxe neutralisée',      text: "Plus aucun kilomètre ne supporte la taxe carbone." },
  { min: .8,   tone: 'em',   title: 'Exposition faible',     text: "L'essentiel de votre consommation est protégé de la taxe." },
  { min: .5,   tone: 'lime', title: 'Exposition maîtrisée',  text: "La moitié de votre exposition est déjà couverte." },
  { min: .25,  tone: 'warn', title: 'Exposition à réduire',  text: "La transition est lancée, mais l'essentiel de la taxe reste à votre charge." },
  { min: 1e-9, tone: 'crit', title: 'Exposition forte',      text: "Vos premiers kilomètres sont protégés. L'essentiel de la taxe reste à votre charge." },
  { min: 0,    tone: 'crit', title: 'Pleinement exposé',     text: "Chaque litre de gazole que vous achetez portera la taxe carbone." },
];
const verdictOf = share => VERDICTS.find(v => share >= v.min) || VERDICTS[VERDICTS.length - 1];

(function selfTest() {
  const near = (a, b, e = 1e-4) => Math.abs(a - b) < e;
  const checks = [
    ['Surcoût gazole 60 €/t = 0,1608 €/L', near(surcoutLitre(60), 0.1608)],
    ['Porteur 28 L/100 km à 60 €/t = 0,04502 €/km', near(surcoutKm(28, 60), 0.04502, 1e-5)],
    ['500 000 km à 30 L/100 km et 60 €/t = 24 120 €', near(surcoutAn(500000, 30, 60), 24120, 1e-6)],
    ['100 % de transition = 0 €', surcoutAn(500000, 30, 60, 1) === 0],
    ['Verdict 0 % = Pleinement exposé', verdictOf(0).title === 'Pleinement exposé'],
    ['Verdict 30 % = Exposition à réduire', verdictOf(.3).title === 'Exposition à réduire'],
    ['Verdict 100 % = Taxe neutralisée', verdictOf(1).title === 'Taxe neutralisée'],
  ];
  const ko = checks.filter(c => !c[1]);
  console[ko.length ? 'error' : 'info'](`[EU ETS 2] ${checks.length - ko.length}/${checks.length} contrôles OK`, ko.map(c => c[0]));
})();

/* ============================================================
   2. FORMATAGE & PRIMITIVES UI
   ============================================================ */
const nf = d => new Intl.NumberFormat('fr-FR', { minimumFractionDigits: d, maximumFractionDigits: d });
const eur = (v, d = 0) => nf(d).format(v) + ' €';
const num = (v, d = 0) => nf(d).format(v);

const TONES = {
  em: { fg: 'var(--emerald-ink)', bg: 'var(--emerald-soft)' }, lime: { fg: 'var(--lime)', bg: 'var(--lime-soft)' },
  warn: { fg: 'var(--warn)', bg: 'var(--warn-soft)' }, crit: { fg: 'var(--crit)', bg: 'var(--crit-soft)' },
};

function NumField({ id, label, value, onChange, suffix, max }) {
  const [txt, setTxt] = useState(String(value));
  useEffect(() => { if (parseFloat(txt.replace(/\s/g, '').replace(',', '.')) !== value) setTxt(String(value)); }, [value]);
  return (
    <label htmlFor={id} className="flex flex-col gap-1 min-w-0">
      <span className="text-[13px] text-ink">{label}</span>
      <span className="flex items-center rounded-md border border-line bg-surface focus-within:border-ink">
        <input id={id} inputMode="decimal" className="num w-full min-w-0 bg-transparent px-3 py-2 text-[15px] outline-none text-ink"
          value={txt} onChange={e => { setTxt(e.target.value); const v = parseFloat(e.target.value.replace(/\s/g, '').replace(',', '.'));
            if (!isNaN(v)) onChange(Math.max(0, max != null ? Math.min(max, v) : v)); }}
          onBlur={() => setTxt(String(value))} />
        {suffix && <span className="pr-3 text-[12px] text-muted whitespace-nowrap">{suffix}</span>}
      </span>
    </label>
  );
}

const Panel = ({ title, eyebrow, children, className = '' }) => (
  <section className={`rounded-xl border border-line bg-surface p-4 sm:p-5 flex flex-col gap-4 ${className}`}>
    {(title || eyebrow) && <header>{eyebrow && <div className="eyebrow">{eyebrow}</div>}{title && <h2 className="font-display text-[18px] font-semibold leading-snug">{title}</h2>}</header>}
    {children}
  </section>
);

/* ============================================================
   3. PREMIER ÉCRAN : ESTIMATION
   ============================================================ */
function Explainer() {
  return (
    <div className="rounded-lg bg-surface2 p-4 text-[13px] flex flex-col gap-1">
      <b>EU ETS 2, de quoi parle-t-on ?</b>
      <span>Depuis le 1<sup>er</sup> janvier 2028, une taxe carbone européenne s'applique aux carburants routiers. Ce sont les distributeurs de carburant
        qui l'acquittent, puis ils la répercutent à la pompe : vous la paierez dans votre facture de gazole, sans ligne dédiée.</span>
    </div>
  );
}

function PriceCompare({ km, conso, price, onPick }) {
  const max = Math.max(...PRICES.map(p => p.price));
  return (
    <Panel eyebrow="Prix du quota carbone" title="Trois hypothèses à comparer">
      <div role="radiogroup" aria-label="Prix du quota carbone" className="flex flex-col gap-2.5">
        {PRICES.map(p => {
          const on = p.price === price, total = surcoutAn(km, conso, p.price);
          return (
            <button key={p.price} role="radio" aria-checked={on} onClick={() => onPick(p.price)}
              className="grid items-center gap-x-4 gap-y-1 rounded-lg border px-3 py-3 text-left transition-colors sm:grid-cols-[130px_minmax(0,1fr)_130px]"
              style={{ borderColor: on ? 'var(--crit)' : 'var(--line)', background: on ? 'var(--crit-soft)' : 'var(--surface)' }}>
              <span className="flex flex-col leading-tight"><span className="num font-semibold text-[15px]">{p.price} €/t</span><span className="text-[12px] text-muted">{p.label}</span></span>
              <span className="h-3 rounded-full bg-surface2 overflow-hidden" aria-hidden="true">
                <span className="block h-full rounded-full" style={{ width: `${p.price / max * 100}%`, background: on ? 'var(--crit)' : 'var(--red-muted)', transition: 'width .3s' }} />
              </span>
              <span className="flex flex-col leading-tight sm:text-right"><span className="num font-semibold text-[15px]">{eur(total)}<span className="text-[12px] font-normal text-muted"> /an</span></span>
                <span className="num text-[12px] text-muted">{eur(total * YEARS)} sur {YEARS} ans</span></span>
            </button>
          );
        })}
      </div>
    </Panel>
  );
}

function Result({ km, conso, price }) {
  const total = surcoutAn(km, conso, price);
  const mini = (label, v) => <div className="min-w-0"><div className="text-[12px] text-muted">{label}</div><div className="num text-[16px] font-semibold">{v}</div></div>;
  return (
    <aside className="rounded-xl border border-line bg-surface p-5 flex flex-col gap-4 self-start" aria-live="polite">
      <div className="flex items-center justify-between"><span className="eyebrow">Votre surcoût EU ETS 2</span>
        <span className="num rounded-full bg-critsoft px-2 py-0.5 text-[12px] font-semibold text-crit">{price} €/t</span></div>
      <div className="num text-[38px] font-bold leading-none text-crit">{eur(total)}<span className="text-[14px] font-normal text-muted"> /an</span></div>
      <div className="grid grid-cols-3 gap-3 border-t border-line pt-4">
        {mini('Au kilomètre', `${nf(3).format(surcoutKm(conso, price))} €`)}
        {mini('Au litre de gazole', `+${nf(3).format(surcoutLitre(price))} €`)}
        {mini(`Sur ${YEARS} ans`, eur(total * YEARS))}
      </div>
      <p className="text-[12px] text-muted">Projection sur {YEARS} ans à prix du quota et consommation constants, soit la durée d'un contrat de location de 36 mois.</p>
    </aside>
  );
}

function Transition({ km, conso, price, share, setShare }) {
  const base = surcoutAn(km, conso, price), kept = base * (1 - share), saved = base * share;
  const line = share === 0 ? "Et si vous démarriez votre transition ?" : share < .5 ? "Vous démarrez votre transition." : share < 1 ? "La transition, c'est maintenant." : "Une flotte sans taxe carbone.";
  return (
    <Panel eyebrow="Et si vous agissiez ?" title={line}>
      <div className="flex flex-col gap-1.5">
        <div className="flex items-baseline justify-between gap-3">
          <label htmlFor="share" className="text-[13px]">Part de vos kilomètres passée à l'électrique ou aux biocarburants certifiés</label>
          <span className="num text-[18px] font-semibold">{Math.round(share * 100)} %</span>
        </div>
        <input id="share" type="range" min="0" max="100" step="5" value={Math.round(share * 100)} onChange={e => setShare(Number(e.target.value) / 100)} />
      </div>
      <div className="grid gap-3 sm:grid-cols-3">
        <div className="rounded-lg bg-surface2 p-3"><div className="text-[12px] text-muted">Taxe restant à votre charge</div>
          <div className="num text-[22px] font-semibold text-crit">{eur(kept)}<span className="text-[12px] font-normal text-muted"> /an</span></div></div>
        <div className="rounded-lg bg-emsoft p-3"><div className="text-[12px] text-muted">Taxe évitée</div>
          <div className="num text-[22px] font-semibold text-emink">{eur(saved)}<span className="text-[12px] font-normal text-muted"> /an</span></div></div>
        <div className="rounded-lg bg-emsoft p-3"><div className="text-[12px] text-muted">Taxe évitée sur {YEARS} ans</div>
          <div className="num text-[22px] font-semibold text-emink">{eur(saved * YEARS)}</div></div>
      </div>
      <p className="text-[12px] text-muted">Un biocarburant certifié durable (B100, HVO100, biogaz) et l'électricité ne supportent pas la taxe carbone.</p>
    </Panel>
  );
}

function Verdict({ km, conso, price, share }) {
  const v = verdictOf(share), t = TONES[v.tone];
  const base = surcoutAn(km, conso, price) * YEARS;
  return (
    <section className="rounded-xl p-5 sm:p-6 flex flex-col gap-2" style={{ background: t.bg }} aria-live="polite">
      <div className="eyebrow" style={{ color: t.fg }}>Votre situation face à l'EU ETS 2</div>
      <div className="font-display text-[28px] sm:text-[34px] font-bold leading-tight" style={{ color: t.fg }}>{v.title}</div>
      <p className="text-[14px] text-ink max-w-[70ch]">{v.text} <span className="num">Il vous reste <b>{eur(base * (1 - share))}</b> de taxe à absorber sur {YEARS} ans{share > 0 ? <>, contre <b>{eur(base)}</b> sans action</> : null}.</span></p>
    </section>
  );
}

function Banners({ km, conso, price, share }) {
  const vol = volumeAn(km, conso), taxPerL = surcoutLitre(price) * (1 - share);
  return (
    <div className="grid gap-4 md:grid-cols-2">
      <section className="rounded-xl border border-line p-5 flex flex-col gap-1.5">
        <div className="eyebrow" style={{ color: 'var(--emerald-ink)' }}>Passer à l'énergie alternative</div>
        <h3 className="font-display text-[17px] font-semibold">Électrique, B100, biogaz : la taxe disparaît avec le gazole</h3>
        <p className="text-[13px] text-muted">Chaque kilomètre qui quitte le gazole fossile sort du périmètre de la taxe. Flexy Green vous accompagne dans le choix de l'énergie adaptée à vos tournées.</p>
      </section>
      <section className="rounded-xl border border-line p-5 flex flex-col gap-1.5">
        <div className="eyebrow" style={{ color: 'var(--katalii)' }}>Éco-conduite</div>
        <h3 className="font-display text-[17px] font-semibold">Avez-vous pensé à l'éco-conduite ?</h3>
        <p className="text-[13px] text-muted">Jusqu'à 15 à 20 % de carburant économisé, soit <b className="num text-ink">{num(vol * ECO_MIN)} à {num(vol * ECO_MAX)} litres</b> de gazole en moins par an
          sur la flotte saisie, et jusqu'à <b className="num text-ink">{eur(vol * ECO_MIN * taxPerL)} à {eur(vol * ECO_MAX * taxPerL)}</b> de taxe carbone évitée, sans changer de véhicule.</p>
      </section>
    </div>
  );
}

function Estimate({ sim, setSim, goMore }) {
  const { km, conso, price, share } = sim;
  const up = patch => setSim(s => ({ ...s, ...patch }));
  return (
    <div className="flex flex-col gap-5">
      <div className="grid gap-5 lg:grid-cols-[minmax(0,1fr)_400px]">
        <Panel eyebrow="Votre flotte" title="Deux informations suffisent">
          <div className="grid gap-4 sm:grid-cols-2">
            <NumField id="km" label="Kilométrage annuel de la flotte entière" value={km} onChange={v => up({ km: v })} suffix="km/an" max={500000000} />
            <NumField id="conso" label="Consommation moyenne" value={conso} onChange={v => up({ conso: v })} suffix="L/100 km" max={100} />
          </div>
          <p className="num text-[12px] text-muted">Soit {num(volumeAn(km, conso))} litres de gazole par an.</p>
          <Explainer />
        </Panel>
        <Result km={km} conso={conso} price={price} />
      </div>
      <PriceCompare km={km} conso={conso} price={price} onPick={v => up({ price: v })} />
      <Transition km={km} conso={conso} price={price} share={share} setShare={v => up({ share: v })} />
      <Verdict km={km} conso={conso} price={price} share={share} />
      <Banners km={km} conso={conso} price={price} share={share} />
      <p className="text-[12px] text-muted max-w-[90ch]">
        Hypothèses : facteur d'émission du gazole de 2,68 kgCO2 par litre (règlement (UE) 2018/2066). Prix du quota : trois hypothèses de simulation,
        dont 45 €/t, seuil du mécanisme de stabilité du marché (exprimé en euros 2020). Estimation indicative et non contractuelle, hors TVA. Dernière mise à jour : octobre 2026.
      </p>
    </div>
  );
}

/* ============================================================
   4. POUR ALLER PLUS LOIN : DEMANDE DE RAPPEL PAR UN EXPERT
   ============================================================ */
// Envoi vers la fonction serverless /api/lead, qui transmet à la liste Sarbacane.
async function submitLead(payload) {
  const res = await fetch('/api/lead', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
  if (!res.ok) throw new Error(String(res.status));
}
// Origine du lead : paramètres UTM, plus la page hôte (paramètre « from » ajouté par embed.js)
const utm = () => { try { const p = new URLSearchParams(location.search);
  const parts = ['utm_source', 'utm_medium', 'utm_campaign'].map(k => p.get(k)).filter(Boolean);
  if (p.get('from')) parts.push(`page ${p.get('from').slice(0, 80)}`);
  return parts.join(' / ') || 'direct'; } catch { return 'direct'; } };

function More({ sim }) {
  const [f, setF] = useState({ prenom: '', nom: '', societe: '', siret: '', fonction: '', email: '', tel: '', consent: false, website: '' });
  const [err, setErr] = useState({});
  const [state, setState] = useState('idle'); // idle | sending | sent | failed
  const up = k => e => setF(s => ({ ...s, [k]: e.target.type === 'checkbox' ? e.target.checked : e.target.value }));
  const submit = async e => {
    e.preventDefault();
    const x = {};
    for (const k of ['prenom', 'nom', 'societe', 'fonction']) if (!f[k].trim()) x[k] = 'Champ obligatoire';
    if (!/^\d{14}$/.test(f.siret.replace(/\s/g, ''))) x.siret = 'Le SIRET comporte 14 chiffres';
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(f.email.trim())) x.email = 'Saisissez une adresse e-mail valide, par exemple nom@societe.fr';
    if (!/^[+\d][\d\s.-]{7,}$/.test(f.tel.trim())) x.tel = 'Saisissez un numéro pour que notre expert puisse vous rappeler';
    if (!f.consent) x.consent = 'Cochez cette case pour envoyer votre demande';
    setErr(x);
    if (Object.keys(x).length) { document.getElementById(`g-${Object.keys(x)[0]}`)?.focus(); return; }
    setState('sending');
    try {
      await submitLead({ ...f, siret: f.siret.replace(/\s/g, ''), sim: { km: sim.km, conso: sim.conso, price: sim.price, share: Math.round(sim.share * 100) }, source: utm() });
      setState('sent');
    } catch { setState('failed'); }
  };
  const field = (k, label, props = {}) => (
    <label htmlFor={`g-${k}`} className="flex flex-col gap-1 min-w-0">
      <span className="text-[12px] text-muted">{label}</span>
      <input id={`g-${k}`} value={f[k]} onChange={up(k)} aria-invalid={!!err[k]} {...props}
        className="rounded-md border bg-surface px-3 py-2 text-[14px] text-ink outline-none focus:border-ink" style={{ borderColor: err[k] ? 'var(--crit)' : 'var(--line)' }} />
      {err[k] && <span className="text-[12px] text-crit">{err[k]}</span>}
    </label>
  );
  const offer = ['Identifier l\'énergie la mieux adaptée à votre activité : électrique, B100, biogaz…', 'Optimiser vos tournées pour consommer moins',
    'Calculer le coût total de possession (TCO) de chaque option'];
  if (state === 'sent') return (
    <Panel eyebrow="Demande envoyée" title="Merci, un expert vous rappelle prochainement">
      <p className="text-[14px]">Un e-mail de confirmation vient de vous être envoyé. Notre expert reprendra votre simulation avec vous pour étudier la faisabilité des énergies alternatives sur votre activité.</p>
    </Panel>
  );
  return (
    <div className="grid gap-5 lg:grid-cols-[minmax(0,1fr)_minmax(0,1.2fr)]">
      <Panel eyebrow="Pour aller plus loin" title="Échangez avec nos experts">
        <p className="text-[14px]">Contactez notre expert, il vous aide à :</p>
        <ul className="flex flex-col gap-2">{offer.map(t => <li key={t} className="flex gap-2.5 text-[14px]"><span className="text-emink mt-0.5" aria-hidden="true">✓</span>{t}</li>)}</ul>
        <div className="rounded-lg bg-emsoft p-4 text-[13px]"><b>Ce que vous recevez</b> : une étude de faisabilité des énergies alternatives pour votre flotte, avec son impact sur votre TCO.</div>
      </Panel>
      <form onSubmit={submit} noValidate className="rounded-xl border border-line bg-surface p-4 sm:p-5 flex flex-col gap-4">
        <div><div className="eyebrow">Demande de rappel</div><h2 className="font-display text-[18px] font-semibold">Vos coordonnées</h2></div>
        <div className="grid gap-3 sm:grid-cols-2">
          {field('prenom', 'Prénom', { autoComplete: 'given-name' })}
          {field('nom', 'Nom', { autoComplete: 'family-name' })}
          {field('societe', 'Société', { autoComplete: 'organization' })}
          {field('siret', 'SIRET', { inputMode: 'numeric', placeholder: '14 chiffres' })}
          {field('fonction', 'Fonction', { autoComplete: 'organization-title', placeholder: 'ex. Responsable de parc' })}
          {field('tel', 'Téléphone', { type: 'tel', autoComplete: 'tel' })}
          <div className="sm:col-span-2">{field('email', 'E-mail professionnel', { type: 'email', autoComplete: 'email' })}</div>
        </div>
        <input value={f.website} onChange={up('website')} tabIndex={-1} autoComplete="off" aria-hidden="true" style={{ position: 'absolute', left: '-9999px', width: 1, height: 1, opacity: 0 }} />
        <label className="flex items-start gap-2.5 text-[13px]">
          <input id="g-consent" type="checkbox" className="mt-0.5" checked={f.consent} onChange={up('consent')} />
          <span>J'accepte que Groupe Berto utilise mes coordonnées et les données de ma simulation pour me recontacter au sujet de l'EU ETS 2.
            {err.consent && <span className="block text-[12px] text-crit">{err.consent}</span>}</span>
        </label>
        <button type="submit" disabled={state === 'sending'} className="rounded-md bg-emink px-4 py-3 text-[14px] font-semibold disabled:opacity-60" style={{ color: 'var(--surface)' }}>
          {state === 'sending' ? 'Envoi en cours…' : 'Être rappelé par un expert'}</button>
        {state === 'failed' && <p className="text-[13px] text-crit" role="alert">L'envoi n'a pas abouti. Merci de réessayer dans quelques instants.</p>}
        <p className="text-[12px] text-muted">Vos données sont utilisées par Groupe Berto pour répondre à votre demande, conformément au RGPD. Vous pouvez demander leur accès ou leur suppression à tout moment.</p>
      </form>
    </div>
  );
}

/* ============================================================
   5. APPLICATION
   ============================================================ */
function App() {
  const [sim, setSim] = useState({ km: 500000, conso: 30, price: 60, share: 0 });
  const [tab, setTab] = useState('estimate');
  const embed = window.EMBED;
  // Intégré, le défilement est celui de la page hôte : on le lui demande (embed.js)
  const go = t => { setTab(t); if (embed) parent.postMessage({ type: 'ets2:scroll' }, '*'); else scrollTo({ top: 0, behavior: 'smooth' }); };

  // Intégré, on transmet la hauteur du contenu à la page hôte pour que le cadre s'ajuste, sans barre de défilement interne
  useEffect(() => {
    if (!embed) return;
    const root = document.getElementById('root');
    const post = () => parent.postMessage({ type: 'ets2:height', height: Math.ceil(root.getBoundingClientRect().height) }, '*');
    const ro = new ResizeObserver(post); ro.observe(root); post();
    return () => ro.disconnect();
  }, []);

  return (
    <div className={`mx-auto max-w-[1100px] px-4 sm:px-6 flex flex-col gap-6 ${embed ? 'py-2' : 'py-6'}`}>
      <header className="flex flex-col gap-6">
        {!embed && <>
        <div className="flex items-center justify-between gap-4">
          <img src="assets/logo-berto.png" alt="Groupe Berto" className="h-8 w-auto" />
          <span className="flex items-center gap-2 text-[12px] text-muted">Une offre<img src="assets/logo-flexy-green.png" alt="Flexy Green" className="h-12 w-auto rounded" /></span>
        </div>
        <div className="flex flex-col gap-2">
          <h1 className="font-display text-[22px] sm:text-[30px] lg:text-[34px] font-semibold leading-[1.12]">Combien la taxe carbone EU ETS 2 coûtera-t-elle à votre flotte ?</h1>
          <p className="text-muted text-[15px]">Estimez le surcoût ou l'impact de cette taxe pour votre activité à partir du 1<sup>er</sup> janvier 2028.</p>
        </div>
        </>}
        <div role="tablist" aria-label="Sections" className="flex gap-7 text-[14px] border-b border-line">
          {[['estimate', "Estimer l'impact"], ['more', 'Pour aller plus loin']].map(([v, l]) => {
            const on = tab === v;
            return <button key={v} role="tab" aria-selected={on} onClick={() => go(v)} className="-mb-px border-b-2 pb-2.5 font-medium transition-colors"
              style={{ borderColor: on ? 'var(--emerald)' : 'transparent', color: on ? 'var(--ink)' : 'var(--muted)' }}>{l}</button>;
          })}
        </div>
      </header>
      {tab === 'estimate' ? <Estimate sim={sim} setSim={setSim} goMore={() => go('more')} /> : <More sim={sim} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
